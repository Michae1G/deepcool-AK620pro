[package]
name = "deepcool-digital-linux"
version = "0.10.5"
edition = "2021"

[dependencies]
libloading = "0.9.0"
hidapi = "2.6.5"
cpu-monitor = "0.1.1"
colored = "3.1.1"

# Windows specific dependencies
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winbase", "winnt", "processthreadsapi", "sysinfoapi", "pdh", "winreg", "winerror", "errhandlingapi", "minwindef", "fileapi", "handleapi", "oleauto", "objbase", "wbemcli", "combaseapi", "oaidl", "wtypesbase"] }

[profile.release]
opt-level = 3
lto = true
strip = "symbols"